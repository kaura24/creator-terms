<style>

@keyframes marq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.demo-pulse{width:44px;height:44px;background:#FFBC00;border-radius:50%;animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}100%{transform:scale(1);opacity:1}}
.demo-spring{animation:spring 1.8s infinite}
@keyframes spring{0%,100%{transform:scale(1)}30%{transform:scale(1.25,.75)}50%{transform:scale(.85,1.2)}70%{transform:scale(1.1,.9)}}

.demo-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:10px;font-size:14px;display:none;border-radius:12px 12px 0 0}

@keyframes tipAuto{0%,100%{opacity:0;transform:translateY(6px)}25%,70%{opacity:1;transform:translateY(0)}}

@keyframes accAuto{0%,100%{height:22px}30%,70%{height:58px}}

@keyframes pageAuto{0%,100%{background:#fff}25%{background:#FFBC00}}

.auto-toast{position:absolute;bottom:10px;left:50%;background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:14px;animation:toastAuto 4s ease-in-out infinite}

<body>
<header>
<h1>크리에이터 용어 사전</h1>
<p class="lead">“좀 더 세련되게” 말고, 이름으로 요청하자. UI · 모션그래픽 · 촬영 · 효과 용어를 의미 중심으로 정리했다. 원하는 용어를 찾고, 아래 요청 문장을 복사해서 AI나 제작자에게 그대로 붙여넣으면 된다.</p>
</header>
<div class="controls">
<input id="q" type="search" placeholder="검색은 선택 사항 — 카테고리를 누르면 목록이 전부 아래에 뜬다">
<button data-cat="all" class="active">전체</button>
<button data-cat="ui">UI 구조 · 움직임</button>
<button data-cat="motion">모션그래픽</button>
<button data-cat="camera">촬영 기법</button>
<button data-cat="effect">효과</button>
<button data-cat="web">웹사이트 움직임</button>
<button id="expandAll">예시 전부 접기</button>
<div class="fontbox"><label for="fs">글자 크기</label><input id="fs" type="range" min="14" max="32" value="18"><span id="fsval">18px</span></div>
</div>
<main><div class="grid" id="grid"></div><small class="note" id="count"></small></main>
<footer>이 사전은 일반적인 제작 용어의 의미 정리용이다. 앱·툴마다 같은 이름도 세부 동작이 조금 다를 수 있다.</footer>
<script>
const DATA=[
["ui","토스트","Toast","화면 아래쪽에 잠깐 떴다 사라지는 짧은 알림. 확인 버튼이 없고, 작업을 막지 않는다.","작업이 저장되면 화면 아래에 토스트로 '저장됐어요'를 2초간 보여줘"],
["ui","스낵바","Snackbar","토스트와 비슷하지만 '실행 취소' 같은 간단한 버튼을 함께 둘 수 있는 하단 알림.","삭제 후 하단 스낵바에 '삭제됨'과 실행 취소 버튼을 보여줘"],
["ui","모달","Modal","뒤 화면을 어둡게 하고 앞에 뜨는 팝업. 닫거나 확인하기 전에는 다른 조작을 못 한다.","삭제 버튼을 누르면 확인 모달을 띄우고, 확인해야 삭제되게 해줘"],
["ui","드로어","Drawer","옆에서 미끄러지듯 나오는 서랍식 메뉴나 패널.","왼쪽에서 드로어 메뉴가 슬라이드 인 되게 해줘"],
["ui","툴팁","Tooltip","아이콘이나 버튼에 마우스를 올리면 뜨는 짧은 설명 말풍선.","아이콘에 마우스를 올리면 툴팁으로 기능을 한 줄로 설명해줘"],
["ui","배지","Badge","아이콘 위에 붙는 작은 숫자·점 표시. 읽지 않은 알림 수를 보여줄 때 쓴다.","알림 아이콘 위에 읽지 않은 개수 배지를 표시해줘"],
["ui","아코디언","Accordion","제목을 누르면 아래 내용이 펼쳐졌다 접혔다 하는 목록.","자주 묻는 질문을 아코디언으로 만들고, 하나를 열면 나머지는 접히게 해줘"],
["ui","탭","Tab","한 화면 안에서 내용을 갈아끼우는 상단 메뉴. 페이지를 새로고침하지 않는다.","상단에 탭을 두고, 탭을 누르면 내용만 바뀌게 해줘"],
["ui","브레드크럼","Breadcrumb","지금 위치를 '홈 > 카테고리 > 글'처럼 경로로 보여주는 안내.","페이지 상단에 지금 위치를 브레드크럼으로 표시해줘"],
["ui","스켈레톤 로딩","Skeleton Loading","내용이 오기 전에 회색 뼈대 모양을 먼저 보여주는 로딩 방식.","데이터를 불러오는 동안 스켈레톤 로딩을 보여줘"],
["ui","스피너","Spinner","빙글빙글 도는 로딩 표시. 짧은 대기일 때 쓴다.","저장하는 동안 버튼 안에 스피너를 보여줘"],
["ui","프로그레스 바","Progress Bar","진행 정도를 막대 길이로 보여주는 표시.","업로드 진행률을 프로그레스 바로 표시해줘"],
["ui","토글","Toggle","켜기·끄기를 한 번 눌러 바꾸는 스위치 모양 버튼.","알림 설정을 토글 스위치로 켜고 끌 수 있게 해줘"],
["ui","캐러셀","Carousel","사진이나 카드를 옆으로 넘기며 보는 가로 슬라이드.","사진을 캐러셀로 옆으로 넘길 수 있게 해줘"],
["ui","인피니트 스크롤","Infinite Scroll","아래로 내리면 다음 내용이 자동으로 계속 붙는 방식.","목록은 아래로 내릴 때 다음 항목이 자동으로 이어지게 해줘"],
["ui","풀다운 새로고침","Pull to Refresh","목록을 아래로 당기면 새로고침되는 모바일 제스처.","목록을 아래로 당기면 새로고침되게 해줘"],
["motion","페이드 인 / 아웃","Fade In / Out","투명했다가 서서히 나타나거나, 서서히 사라지는 움직임.","첫 화면 제목이 0.5초 동안 페이드 인 되게 해줘"],
["motion","슬라이드 인","Slide In","한쪽에서 미끄러지듯 들어오는 움직임.","카드들이 아래에서 위로 살짝 슬라이드 인 되게 해줘"],

    case "돌리 인": return stage(`<div class="box" style="animation:dolly 2.4s infinite">카메라가 다가감</div>`);
    case "돌리 아웃": return stage(`<div class="box" style="animation:dolly 2.4s infinite reverse">카메라가 멀어짐</div>`);
    case "크레인 업": return stage(`<div class="box anim-tilt">위로 상승</div>`);
    case "비네트": return stage(`<div class="box">중심</div><div class="demo-vignette"></div>`);
    case "LUT": return stage(`<div style="display:flex;width:90%;height:70px;border-radius:10px;overflow:hidden"><div style="flex:1;background:#ccc;display:flex;align-items:center;justify-content:center;font-size:13px">보정 전</div><div style="flex:1;background:#FFBC00;display:flex;align-items:center;justify-content:center;font-size:13px">보정 후</div></div>`);
    case "로어 서드": return stage(`<div style="position:relative;width:95%;height:80px;background:#ddd;border-radius:10px"><div class="demo-lower">홍길동 · 크리에이터</div></div>`);
    case "스태빌라이제이션": return stage(`<div class="box" style="animation:pan 4s ease-in-out infinite">흔들림 보정 후 부드러움</div>`);
    case "컷": return stage(`<div class="box" style="animation:fade 1s steps(2) infinite">바로 자르기 ✂</div>`);
    case "스무스 스크롤": return stage(`<div class="ball" style="animation:pan 3s ease-in-out infinite">부드럽게 이동</div>`);
    case "스티키 헤더": return stage(`<div class="demo-sticky"><b>📌 상단 메뉴 (따라다님)</b><br>내용 1<br>내용 2<br>내용 3<br>내용 4</div>`);
    case "패럴랙스 스크롤": return stage(`<div class="ball" style="animation:pan 4s infinite"></div><div class="ball" style="width:20px;height:20px;animation:pan 2s infinite"></div>`);
    case "리빌 온 스크롤": return stage(`<div class="box" style="animation:slide 2s infinite">스크롤하면 드러남</div>`);
    case "마퀴": return stage(`<div class="demo-marquee"><span>할인 중 · 할인 중 · 할인 중 ·&nbsp;</span></div>`);
    case "페이지 전환": return stage(`<div class="box" style="animation:fade 2.4s infinite">페이지 A → B 페이드</div>`);
    case "프리로더": return stage(`<div class="spin"></div><span style="margin-left:8px;font-size:14px">로딩 중…</span>`);
    case "백 투 탑": return stage(`<div style="animation:tilt 3.6s ease-in-out infinite">↑ 맨 위로 자동 이동</div>`);
    case "타이핑 효과": return stage(`<div class="demo-type">안녕하세요!</div>`);
    case "카드 리프트": return stage(`<div class="box" style="animation:slide 3.6s ease-in-out infinite">자동으로 떠오름</div>`);
    case "언더라인 애니메이션": return stage(`<span style="border-bottom:3px solid #FFBC00;animation:heroAuto 3.6s infinite">링크 밑줄이 자동으로 그어짐</span>`);
    case "줌 온 호버": return stage(`<div class="box" style="animation:dolly 3.6s ease-in-out infinite">자동으로 커짐</div>`);
    default: return stage(`<div class="box anim-fade">▶ 예시</div>`);
  }
}
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const list=DATA.filter(d=>(cat==="all"||d[0]===cat)&&(!q||(d[1]+d[2]+d[3]+d[4]).toLowerCase().includes(q)));
  const cardHtml=(d)=>`<article class="card"><div class="text-wrap"><span class="tag">${catName[d[0]]}</span><h2>${d[1]} <span>${d[2]}</span></h2><p class="mean">${d[3]}</p><div class="prompt"><b>AI 요청 문장</b>${d[4]}</div><button class="copy" onclick="navigator.clipboard.writeText('${d[4].replace(/'/g,"’")}');this.textContent='복사됨 ✓';setTimeout(()=>this.textContent='요청 문장 복사',1200)">요청 문장 복사</button></div><button class="copy example-toggle">예시 접기 ▴</button><div class="demo-wrap" style="display:block">${demoFor(d[1])}</div></article>`;
  let html="";
  if(cat==="all"&&!q){["ui","motion","camera","effect","web"].forEach(c=>{const sub=list.filter(d=>d[0]===c); if(sub.length) html+=`<h2 class="cat-head">${catName[c]} · ${sub.length}개</h2>`+sub.map(cardHtml).join("");});}
  else html=list.map(cardHtml).join("");
  document.getElementById("grid").innerHTML=html||"<p>검색 결과가 없어. 카테고리를 누르면 해당 목록이 전부 아래에 뜬다.</p>";
  document.getElementById("count").textContent=`총 ${DATA.length}개 용어 중 ${list.length}개 표시 중`;
  document.querySelectorAll("[data-demo]").forEach(btn=>btn.onclick=()=>{
    const card=btn.closest(".card"); const t=btn.dataset.demo;
    const show=(sel)=>{const el=card.querySelector(sel); if(el) el.style.display=el.style.display==="flex"?"none":"flex"};
    if(t==="toast"){const el=card.querySelector(".demo-toast"); el.style.display="block"; setTimeout(()=>el.style.display="none",2000);}
    if(t==="modal") show(".demo-modal"); if(t==="drawer") show(".demo-drawer"); if(t==="tip"){const el=card.querySelector(".demo-tip"); el.style.display="block"; setTimeout(()=>el.style.display="none",2000);}
    if(t==="acc"){const p=card.querySelector(".demo-acc p"); p.style.display=p.style.display==="block"?"none":"block";}
    if(t==="pop"){const el=card.querySelector(".demo-pop"); el.style.display=el.style.display==="block"?"none":"block";}
    if(t==="sheet"){const el=card.querySelector(".demo-sheet"); el.style.display=el.style.display==="block"?"none":"block";}
    if(t==="drop"){const el=card.querySelector(".demo-drop"); el.style.display=el.style.display==="block"?"none":"block";}
    if(t==="toggle"){const s=btn.nextElementSibling; const on=s.textContent.includes("OFF"); s.textContent=on?"● ON":"● OFF";}
  });
  document.querySelectorAll(".demo-tabs [data-tab]").forEach(btn=>btn.onclick=()=>{const tabs=btn.closest(".demo-tabs"); if(tabs) tabs.querySelector(".tabbody").textContent=btn.dataset.tab+" 내용";});
  document.querySelectorAll("[data-page]").forEach(btn=>btn.onclick=()=>{btn.parentElement.querySelectorAll("[data-page]").forEach(x=>x.classList.remove("active")); btn.classList.add("active");});
  document.querySelectorAll("[data-count]").forEach(el=>{let n=0; const target=+el.dataset.count; clearInterval(el._t); el._t=setInterval(()=>{n+=2; if(n>=target){n=target; clearInterval(el._t);} el.textContent=n;},30);});
  document.querySelectorAll(".example-toggle").forEach(btn=>btn.onclick=()=>{
    const wrap=btn.nextElementSibling; const open=wrap.style.display!=="none";
    wrap.style.display=open?"none":"block";
    btn.textContent=open?"예시 보기 ▾ — 아래에 예시가 펼쳐진다":"예시 접기 ▴";
    if(!open){wrap.querySelectorAll("[data-count]").forEach(el=>{let n=0; const target=+el.dataset.count; clearInterval(el._t); el._t=setInterval(()=>{n+=2; if(n>=target){n=target; clearInterval(el._t);} el.textContent=n;},30);});}
  });
}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.getElementById("expandAll").onclick=()=>{const wraps=document.querySelectorAll(".demo-wrap"); const anyHidden=[...wraps].some(w=>w.style.display==="none"); wraps.forEach(w=>w.style.display=anyHidden?"block":"none"); document.querySelectorAll(".example-toggle").forEach(b=>b.textContent=anyHidden?"예시 접기 ▴":"예시 보기 ▾ — 아래에 예시가 펼쳐진다"); document.getElementById("expandAll").textContent=anyHidden?"예시 전부 접기":"예시 전부 펼치기";};
document.getElementById("q").oninput=render;
const fs=document.getElementById("fs");fs.oninput=()=>{document.documentElement.style.setProperty("--fs",fs.value+"px");document.getElementById("fsval").textContent=fs.value+"px"};
render();
</script>

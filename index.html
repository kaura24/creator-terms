<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크리에이터 용어 사전 — UI · 모션 · 촬영 · 효과</title>
<meta name="description" content="영상, 앱, 웹사이트를 만들 때 헷갈리는 용어를 의미 중심으로 한눈에 정리한 사전. 검색하고, AI 요청 문장을 그대로 복사해서 쓸 수 있다.">
<style>
:root{--fs:18px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f7f5ef;color:#222;font-size:var(--fs);line-height:1.65}
header{padding:28px 20px 18px;max-width:1060px;margin:0 auto}
h1{font-size:1.7em;line-height:1.25;margin:0 0 8px}
p.lead{margin:0;color:#555}
.controls{max-width:1060px;margin:0 auto;padding:0 20px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search]{flex:1;min-width:220px;padding:12px 14px;border:1px solid #ccc;border-radius:12px;font-size:16px;background:#fff}
button{cursor:pointer;border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 14px;font-size:15px}
button.active{background:#222;color:#fff;border-color:#222}
.fontbox{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:14px;color:#555}
.fontbox input{width:130px}
main{max-width:1060px;margin:0 auto;padding:6px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e3ddcd;border-radius:16px;padding:16px}
.tag{display:inline-block;font-size:13px;background:#fff3d6;border:1px solid #f0d48a;border-radius:999px;padding:2px 9px;margin-bottom:8px}
.card h2{font-size:1.05em;margin:0 0 6px}
.card h2 span{color:#888;font-weight:500;font-size:.85em}
.mean{margin:0 0 10px;color:#333}
.prompt{background:#f4f2ea;border-radius:10px;padding:10px 12px;font-size:.92em}
.prompt b{display:block;color:#666;font-size:.85em;margin-bottom:2px}
.copy{margin-top:10px}
.stage{height:110px;background:#efece2;border-radius:12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stage .box{width:52px;height:52px;background:#ff7a45;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.stage .ball{width:36px;height:36px;background:#ff7a45;border-radius:50%}
.stage .bar{width:70%;height:12px;background:#ddd;border-radius:99px;overflow:hidden}
.stage .bar i{display:block;height:100%;width:40%;background:#ff7a45;border-radius:99px}
@keyframes fade{0%,100%{opacity:0}50%{opacity:1}}
@keyframes slide{0%,100%{transform:translateY(24px);opacity:0}50%{transform:translateY(0);opacity:1}}
@keyframes pan{0%,100%{transform:translateX(-60px)}50%{transform:translateX(60px)}}
@keyframes tilt{0%,100%{transform:translateY(-28px)}50%{transform:translateY(28px)}}
@keyframes dolly{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
@keyframes orbit{from{transform:rotate(0) translateX(55px) rotate(0)}to{transform:rotate(360deg) translateX(55px) rotate(-360deg)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}50%{transform:translate(-2px,2px)}75%{transform:translate(2px,1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes morph{0%,100%{border-radius:50%}50%{border-radius:8px;transform:rotate(45deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(28px) scale(1.2,.7)}50%{transform:translateY(-30px) scale(.9,1.1)}70%{transform:translateY(28px) scale(1.15,.8)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes cross{0%,100%{opacity:1}50%{opacity:0}}
@keyframes wipe{0%,100%{transform:translateX(-100%)}50%{transform:translateX(0)}}
@keyframes glow{0%,100%{text-shadow:0 0 4px #ffb27a}50%{text-shadow:0 0 18px #ff7a45}}
.anim-fade{animation:fade 2.4s infinite}.anim-slide{animation:slide 2.4s infinite}.anim-pan{animation:pan 3s ease-in-out infinite}.anim-tilt{animation:tilt 3s ease-in-out infinite}.anim-dolly{animation:dolly 3s ease-in-out infinite}.anim-orbit{animation:orbit 3s linear infinite}.anim-shake{animation:shake .4s infinite}.anim-spin{animation:spin 1.2s linear infinite}.anim-morph{animation:morph 2.4s infinite}.anim-bounce{animation:bounce 1.8s infinite}.anim-smooth{animation:pan 4s ease-in-out infinite}
.skel{width:80%;display:flex;flex-direction:column;gap:8px}.skel div{height:12px;border-radius:99px;background:linear-gradient(90deg,#ddd 25%,#f2f2f2 50%,#ddd 75%);background-size:200px 100%;animation:shimmer 1.4s infinite}
.spin{width:34px;height:34px;border:4px solid #ddd;border-top-color:#ff7a45;border-radius:50%;animation:spin 1s linear infinite}
.progress{width:80%;height:14px;background:#ddd;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#ff7a45;animation:prog 2.5s ease-in-out infinite}@keyframes prog{0%{width:0}70%,100%{width:100%}}
.demo-toast{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:14px;display:none}
.demo-modal{position:absolute;inset:18px;background:#fff;border-radius:12px;display:none;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.demo-drawer{position:absolute;top:0;bottom:0;left:0;width:55%;background:#fff;display:none;align-items:center;justify-content:center;font-size:15px;box-shadow:4px 0 16px rgba(0,0,0,.15)}
.demo-tip{position:absolute;top:8px;background:#222;color:#fff;padding:4px 10px;border-radius:8px;font-size:13px;display:none}
.demo-badge{position:relative;font-size:28px}.demo-badge b{position:absolute;top:-8px;right:-10px;background:#e33;color:#fff;font-size:12px;border-radius:99px;padding:1px 6px}
.demo-acc{width:85%;background:#fff;border-radius:10px;padding:8px 12px;font-size:15px;text-align:left}.demo-acc p{display:none;margin:6px 0 0;color:#555}
.demo-tabs{width:90%}.demo-tabs .tabbody{background:#fff;border-radius:10px;padding:8px;margin-top:6px;font-size:15px}
.demo-grain{position:absolute;inset:0;opacity:.25;background-image:radial-gradient(#000 1px,transparent 1px);background-size:6px 6px;animation:shake .3s infinite}
.demo-bars{position:absolute;left:0;right:0;height:16px;background:#000}.demo-bars.top{top:0}.demo-bars.bottom{bottom:0}
.demo-cross{position:absolute;inset:0}.demo-cross div{position:absolute;inset:0}.demo-cross div:last-child{animation:cross 3s infinite}
.demo-wipe{position:absolute;inset:0;background:#ff7a45;animation:wipe 3s ease-in-out infinite}
.demo-blur{font-size:22px;font-weight:700;animation:blur 3s infinite}@keyframes blur{0%,100%{filter:blur(6px);opacity:.5}50%{filter:blur(0);opacity:1}}
.demo-glow{font-size:22px;font-weight:800;animation:glow 2s infinite}
.demo-count{font-size:28px;font-weight:800}
.demo-stagger{display:flex;gap:10px}.demo-stagger i{width:26px;height:26px;background:#ff7a45;border-radius:50%;animation:slide 1.8s infinite}.demo-stagger i:nth-child(2){animation-delay:.2s}.demo-stagger i:nth-child(3){animation-delay:.4s}
small.note{display:block;color:#777;margin-top:16px}
footer{max-width:1060px;margin:0 auto;padding:0 20px 36px;color:#777;font-size:14px}
@media(max-width:600px){.fontbox{margin-left:0}}
</style>
</head>
<body>
<header>
<h1>크리에이터 용어 사전</h1>
<p class="lead">“좀 더 세련되게” 말고, 이름으로 요청하자. UI · 모션그래픽 · 촬영 · 효과 용어를 의미 중심으로 정리했다. 원하는 용어를 찾고, 아래 요청 문장을 복사해서 AI나 제작자에게 그대로 붙여넣으면 된다.</p>
</header>
<div class="controls">
<input id="q" type="search" placeholder="용어 검색 — 예: 토스트, 패닝, 스태거">
<button data-cat="all" class="active">전체</button>
<button data-cat="ui">UI 구조 · 움직임</button>
<button data-cat="motion">모션그래픽</button>
<button data-cat="camera">촬영 기법</button>
<button data-cat="effect">효과</button>
<div class="fontbox"><label for="fs">글자 크기</label><input id="fs" type="range" min="14" max="32" value="18"><span id="fsval">18px</span></div>
</div>
<main><div class="grid" id="grid"></div><small class="note" id="count"></small></main>
<footer>이 사전은 일반적인 제작 용어의 의미 정리용이다. 앱·툴마다 같은 이름도 세부 동작이 조금 다를 수 있다.</footer>
<script>
const DATA=[
["ui","토스트","Toast","화면 아래쪽에 잠깐 떴다 사라지는 짧은 알림. 확인 버튼이 없고, 작업을 막지 않는다.","작업이 저장되면 화면 아래에 토스트로 '저장됐어요'를 2초간 보여줘"],
["ui","스낵바","Snackbar","토스트와 비슷하지만 '실행 취소' 같은 간단한 버튼을 함께 둘 수 있는 하단 알림.","삭제 후 하단 스낵바에 '삭제됨'과 실행 취소 버튼을 보여줘"],
["ui","모달","Modal","뒤 화면을 어둡게 하고 앞에 뜨는 팝업. 닫거나 확인하기 전에는 다른 조작을 못 한다.","삭제 버튼을 누르면 확인 모달을 띄우고, 확인해야 삭제되게 해줘"],
["ui","드로어","Drawer","옆에서 미끄러지듯 나오는 서랍식 메뉴나 패널.","왼쪽에서 드로어 메뉴가 슬라이드 인 되게 해줘"],
["ui","툴팁","Tooltip","아이콘이나 버튼에 마우스를 올리면 뜨는 짧은 설명 말풍선.","아이콘에 마우스를 올리면 툴팁으로 기능을 한 줄로 설명해줘"],
["ui","배지","Badge","아이콘 위에 붙는 작은 숫자·점 표시. 읽지 않은 알림 수를 보여줄 때 쓴다.","알림 아이콘 위에 읽지 않은 개수 배지를 표시해줘"],
["ui","아코디언","Accordion","제목을 누르면 아래 내용이 펼쳐졌다 접혔다 하는 목록.","자주 묻는 질문을 아코디언으로 만들고, 하나를 열면 나머지는 접히게 해줘"],
["ui","탭","Tab","한 화면 안에서 내용을 갈아끼우는 상단 메뉴. 페이지를 새로고침하지 않는다.","상단에 탭을 두고, 탭을 누르면 내용만 바뀌게 해줘"],
["ui","브레드크럼","Breadcrumb","지금 위치를 '홈 > 카테고리 > 글'처럼 경로로 보여주는 안내.","페이지 상단에 지금 위치를 브레드크럼으로 표시해줘"],
["ui","스켈레톤 로딩","Skeleton Loading","내용이 오기 전에 회색 뼈대 모양을 먼저 보여주는 로딩 방식.","데이터를 불러오는 동안 스켈레톤 로딩을 보여줘"],
["ui","스피너","Spinner","빙글빙글 도는 로딩 표시. 짧은 대기일 때 쓴다.","저장하는 동안 버튼 안에 스피너를 보여줘"],
["ui","프로그레스 바","Progress Bar","진행 정도를 막대 길이로 보여주는 표시.","업로드 진행률을 프로그레스 바로 표시해줘"],
["ui","토글","Toggle","켜기·끄기를 한 번 눌러 바꾸는 스위치 모양 버튼.","알림 설정을 토글 스위치로 켜고 끌 수 있게 해줘"],
["ui","캐러셀","Carousel","사진이나 카드를 옆으로 넘기며 보는 가로 슬라이드.","사진을 캐러셀로 옆으로 넘길 수 있게 해줘"],
["ui","인피니트 스크롤","Infinite Scroll","아래로 내리면 다음 내용이 자동으로 계속 붙는 방식.","목록은 아래로 내릴 때 다음 항목이 자동으로 이어지게 해줘"],
["ui","풀다운 새로고침","Pull to Refresh","목록을 아래로 당기면 새로고침되는 모바일 제스처.","목록을 아래로 당기면 새로고침되게 해줘"],
["motion","페이드 인 / 아웃","Fade In / Out","투명했다가 서서히 나타나거나, 서서히 사라지는 움직임.","첫 화면 제목이 0.5초 동안 페이드 인 되게 해줘"],
["motion","슬라이드 인","Slide In","한쪽에서 미끄러지듯 들어오는 움직임.","카드들이 아래에서 위로 살짝 슬라이드 인 되게 해줘"],
["motion","스태거","Stagger","여러 항목이 시간 차를 두고 하나씩 등장하는 방식.","목록 항목이 0.1초 간격으로 스태거 되게 해줘"],
["motion","스크롤 트리거","Scroll Trigger","스크롤해서 화면에 보일 때 움직임이 시작되는 방식.","각 섹션은 화면에 들어올 때 페이드 인 되게 해줘"],
["motion","호버 효과","Hover Effect","마우스를 올렸을 때 크기·색·그림자가 바뀌는 반응.","버튼에 마우스를 올리면 살짝 커지고 그림자가 생기게 해줘"],
["motion","이징","Easing","움직임이 빨라지고 느려지는 방식. 끝이 부드럽게 멈추면 ease-out이다.","모든 움직임에 ease-out 이징을 써서 끝이 부드럽게 멈추게 해줘"],
["motion","키프레임","Keyframe","애니메이션의 시작·끝·중간 지점을 찍는 기준점.","제목이 키프레임으로 아래에서 위로 올라오게 해줘"],
["motion","루프","Loop","같은 움직임이 계속 반복되는 것.","배경 요소가 끊기지 않게 루프되게 해줘"],
["motion","모핑","Morphing","한 모양이 다른 모양으로 서서히 변하는 효과.","아이콘이 모핑으로 다른 모양으로 바뀌게 해줘"],
["motion","패럴랙스","Parallax","앞·뒤 레이어가 서로 다른 속도로 움직여 깊이감을 주는 효과.","스크롤할 때 배경이 더 느리게 움직이는 패럴랙스를 넣어줘"],
["motion","마스크","Mask","보이는 영역을 모양으로 가려서, 그 안에서만 영상이 보이게 하는 방법.","원형 마스크 안에서만 영상이 보이게 해줘"],
["motion","오버슈트","Overshoot","목표 지점을 살짝 지나쳤다가 되돌아오는 탄성 있는 움직임.","버튼이 오버슈트처럼 살짝 튀었다 제자리로 오게 해줘"],
["motion","앤티시페이션","Anticipation","본 동작 전에 반대 방향으로 살짝 준비 동작을 주는 것.","점프하기 전에 살짝 웅크리는 앤티시페이션을 넣어줘"],
["motion","스쿼시 앤 스트레치","Squash & Stretch","물체가 찌그러졌다 늘어났다 하며 탄성을 표현하는 기본 원리.","공이 튈 때 스쿼시 앤 스트레치로 탄성을 표현해줘"],
["motion","팔로우스루","Follow Through","본체가 멈춘 뒤에도 머리·옷·꼬리 같은 부분이 늦게 따라오는 움직임.","캐릭터가 멈춘 뒤 머리카락이 팔로우스루로 늦게 따라오게 해줘"],
["motion","타이밍","Timing","움직임의 빠르기·간격으로 무게감과 성격을 정하는 것.","무거운 물체는 타이밍을 느리게, 가벼운 물체는 빠르게 해줘"],
["camera","패닝","Panning","카메라를 고정하고 좌우로 돌리며 찍는 것.","풍경을 왼쪽에서 오른쪽으로 패닝으로 훑어줘"],
["camera","틸트","Tilting","카메라를 고정하고 위아래로 돌리며 찍는 것.","건물 아래에서 위로 틸트해서 찍어줘"],
["camera","돌리","Dolly","카메라 자체를 레일·바퀴로 앞뒤·좌우로 이동하며 찍는 것.","인물 쪽으로 천천히 돌리 인 해줘"],
["camera","트래킹 샷","Tracking Shot","움직이는 피사체를 카메라가 따라가며 찍는 것.","걷는 인물을 옆에서 트래킹 샷으로 따라가줘"],
["camera","오비트","Orbit","피사체 주위를 카메라가 빙 돌며 찍는 것.","제품 주위를 오비트 샷으로 한 바퀴 돌며 찍어줘"],
["camera","크레인 샷","Crane Shot","높은 곳에서 아래를 내려다보거나, 위에서 아래로 이동하며 찍는 것.","위에서 아래로 내려오는 크레인 샷으로 시작해줘"],
["camera","핸드헬드","Handheld","삼각대 없이 손으로 들고 찍어 현장감을 주는 방식.","핸드헬드로 살짝 흔들리게 찍어 현장감을 줘"],
["camera","짐벌 샷","Gimbal Shot","짐벌로 흔들림을 잡고 부드럽게 이동하며 찍는 것.","짐벌로 흔들림 없이 부드럽게 따라가줘"],
["camera","드론 샷","Drone Shot","드론으로 공중에서 찍는 것.","위에서 내려다보는 드론 샷으로 장소를 소개해줘"],
["camera","롱테이크","Long Take","끊지 않고 길게 한 번에 찍는 것.","끊지 않는 롱테이크로 한 장면을 이어줘"],
["camera","점프 컷","Jump Cut","같은 장면을 시간·위치가 툭 튀게 잘라 붙이는 편집.","같은 자리에서 점프 컷으로 시간을 건너뛰어줘"],
["camera","매치 컷","Match Cut","모양·움직임이 비슷한 두 장면을 이어 붙이는 편집.","문 여는 동작에서 다음 장면으로 매치 컷으로 이어줘"],
["camera","B롤","B-roll","본 장면 위에 덧붙이는 보조 영상. 장소·손·표정 같은 디테일이다.","설명 위에 장소와 손 움직임을 B롤로 깔아줘"],
["camera","와이드 샷","Wide Shot","장소 전체가 보이게 멀리서 찍는 것.","장소 전체가 보이는 와이드 샷으로 시작해줘"],
["camera","클로즈업","Close-up","얼굴·물건을 가까이 크게 찍는 것.","표정이 보이게 클로즈업으로 찍어줘"],
["camera","오버숄더 샷","Over-the-Shoulder Shot","한 사람의 어깨 너머로 상대방을 찍는 대화 장면.","대화는 오버숄더 샷으로 주고받게 찍어줘"],
["effect","카운트업","Count-up","숫자가 0부터 목표값까지 올라가며 표시되는 효과.","성과 숫자가 화면에 보이면 카운트업 되게 해줘"],
["effect","넘버 롤링","Number Rolling","숫자가 슬롯머신처럼 돌아가며 바뀌는 표시.","가격 숫자가 롤링되며 바뀌게 해줘"],
["effect","디졸브","Dissolve","한 장면이 서서히 겹치며 다음 장면으로 넘어가는 전환.","장면 전환은 디졸브로 부드럽게 넘어가게 해줘"],
["effect","와이프","Wipe","한 장면이 밀어내듯 다음 장면으로 바뀌는 전환.","장면 전환은 와이프로 옆에서 밀고 들어오게 해줘"],
["effect","글로우","Glow","빛이 번지는 듯한 발광 효과.","제목에 은은한 글로우를 넣어줘"],
["effect","블러","Blur","흐릿하게 만드는 효과. 배경을 흐리면 앞이 돋보인다.","배경은 블러 처리하고 앞의 인물만 선명하게 해줘"],
["effect","그레인","Grain","필름처럼 잔잔한 노이즈 입자를 더하는 질감.","영상 전체에 은은한 그레인을 더해줘"],
["effect","슬로 모션","Slow Motion","실제보다 느리게 재생해 순간을 강조하는 것.","결정적인 순간은 슬로 모션으로 느리게 보여줘"],
["effect","타임랩스","Timelapse","긴 시간을 빠르게 압축해 보여주는 것.","하루의 하늘 변화를 타임랩스로 압축해줘"],
["effect","리버스","Reverse","영상을 거꾸로 재생하는 효과.","물이 다시 컵으로 돌아가는 리버스 효과를 넣어줘"],
["effect","그린 스크린","Green Screen","초록 배경을 지우고 다른 배경을 합성하는 방법.","초록 배경을 지우고 도시 배경으로 합성해줘"],
["effect","컬러 그레이딩","Color Grading","영상 전체의 색감·톤을 통일해 분위기를 만드는 색 보정.","따뜻하고 부드러운 톤으로 컬러 그레이딩 해줘"],
["effect","렛터박스","Letterbox","위아래에 검은 띠를 넣어 영화 같은 화면 비율을 만드는 것.","위아래 검은 띠의 렛터박스로 영화 느낌을 줘"],
["effect","모션 블러","Motion Blur","빠른 움직임에 잔상을 남겨 속도감을 주는 흐림.","빠른 움직임에 모션 블러로 속도감을 줘"],
["effect","감소 모션","Reduced Motion","기기의 '동작 줄이기' 설정 사용자를 위해 애니메이션을 줄이거나 끄는 배려.","동작 줄이기를 켠 사람에게는 애니메이션을 끄게 해줘"]
];
const catName={ui:"UI 구조 · 움직임",motion:"모션그래픽",camera:"촬영 기법",effect:"효과"};
let cat="all";
function demoFor(name){
  const b=(t)=>`<button class="copy" data-demo="${t}">예시 보기</button>`;
  const stage=(inner)=>`<div class="stage">${inner}</div>`;
  switch(name){
    case "토스트": return stage(`<div class="demo-toast">저장됐어요</div>`)+b("toast");
    case "스낵바": return stage(`<div class="demo-toast">삭제됨 · 실행 취소</div>`)+b("toast");
    case "모달": return stage(`<div class="demo-modal">정말 삭제할까요? [확인]</div>`)+b("modal");
    case "드로어": return stage(`<div class="demo-drawer">☰ 메뉴</div>`)+b("drawer");
    case "툴팁": return stage(`<span style="font-size:28px">ⓘ</span><span class="demo-tip">이 버튼은 저장 기능이에요</span>`)+b("tip");
    case "배지": return stage(`<span class="demo-badge">🔔<b>3</b></span>`);
    case "아코디언": return stage(`<div class="demo-acc">자주 묻는 질문 ▾<p>답변이 여기에 펼쳐집니다.</p></div>`)+b("acc");
    case "탭": return stage(`<div class="demo-tabs"><button class="copy" data-tab="소개">소개</button> <button class="copy" data-tab="후기">후기</button><div class="tabbody">소개 내용</div></div>`);
    case "스켈레톤 로딩": return stage(`<div class="skel"><div></div><div style="width:60%"></div><div style="width:75%"></div></div>`);
    case "스피너": return stage(`<div class="spin"></div>`);
    case "프로그레스 바": return stage(`<div class="progress"><i></i></div>`);
    case "토글": return stage(`<button class="copy" data-demo="toggle">켜기 / 끄기</button><span style="margin-left:8px">● OFF</span>`);
    case "캐러셀": return stage(`<div class="box anim-pan">1 → 2 → 3</div>`);
    case "페이드 인 / 아웃": return stage(`<div class="box anim-fade">제목</div>`);
    case "슬라이드 인": return stage(`<div class="box anim-slide">카드</div>`);
    case "스태거": return stage(`<div class="demo-stagger"><i></i><i></i><i></i></div>`);
    case "호버 효과": return stage(`<div class="box" onmouseover="this.style.transform='scale(1.2)';this.style.boxShadow='0 8px 20px rgba(0,0,0,.25)'" onmouseout="this.style.transform='';this.style.boxShadow=''">버튼</div>`);
    case "이징": return stage(`<div class="ball" style="animation:pan 2s cubic-bezier(.2,.8,.2,1) infinite"></div>`);
    case "루프": return stage(`<div class="ball anim-spin" style="border-radius:12px">↻</div>`);
    case "모핑": return stage(`<div class="box anim-morph"></div>`);
    case "오버슈트": case "스쿼시 앤 스트레치": return stage(`<div class="ball anim-bounce"></div>`);
    case "패닝": case "트래킹 샷": case "짐벌 샷": return stage(`<div class="box anim-pan">🏃</div>`);
    case "틸트": case "크레인 샷": return stage(`<div class="box anim-tilt">▲</div>`);
    case "돌리": case "드론 샷": case "클로즈업": return stage(`<div class="box anim-dolly">👤</div>`);
    case "오비트": return stage(`<div class="box anim-orbit">●</div>`);
    case "핸드헬드": return stage(`<div class="box anim-shake">📷</div>`);
    case "카운트업": return stage(`<span class="demo-count" data-count="100">0</span>`);
    case "디졸브": return stage(`<div class="demo-cross"><div style="background:#ffb27a"></div><div style="background:#7ab8ff"></div></div>`);
    case "와이프": return stage(`<div style="position:absolute;inset:0;background:#7ab8ff"></div><div class="demo-wipe"></div>`);
    case "글로우": return stage(`<span class="demo-glow">빛나는 제목</span>`);
    case "블러": return stage(`<span class="demo-blur">선명해지는 글자</span>`);
    case "그레인": return stage(`<div class="box">필름</div><div class="demo-grain"></div>`);
    case "슬로 모션": return stage(`<div class="ball" style="animation:pan 6s ease-in-out infinite"></div>`);
    case "타임랩스": return stage(`<div class="box anim-fade">☀ → 🌙</div>`);
    case "렛터박스": return stage(`<div class="box">영화</div><div class="demo-bars top"></div><div class="demo-bars bottom"></div>`);
    case "모션 블러": return stage(`<div class="ball anim-pan" style="box-shadow:-18px 0 0 rgba(255,122,69,.35),-36px 0 0 rgba(255,122,69,.15)"></div>`);
    default: return stage(`<div class="box anim-fade">▶ 예시</div>`);
  }
}
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const list=DATA.filter(d=>(cat==="all"||d[0]===cat)&&(!q||(d[1]+d[2]+d[3]+d[4]).toLowerCase().includes(q)));
  document.getElementById("grid").innerHTML=list.map(d=>`<article class="card"><span class="tag">${catName[d[0]]}</span><h2>${d[1]} <span>${d[2]}</span></h2><p class="mean">${d[3]}</p>${demoFor(d[1])}<div class="prompt"><b>AI 요청 문장</b>${d[4]}</div><button class="copy" onclick="navigator.clipboard.writeText('${d[4].replace(/'/g,"’")}');this.textContent='복사됨 ✓';setTimeout(()=>this.textContent='요청 문장 복사',1200)">요청 문장 복사</button></article>`).join("")||"<p>검색 결과가 없어. 다른 단어로 검색해봐.</p>";
  document.getElementById("count").textContent=`총 ${DATA.length}개 용어 중 ${list.length}개 표시 중`;
  document.querySelectorAll("[data-demo]").forEach(btn=>btn.onclick=()=>{
    const card=btn.closest(".card"); const t=btn.dataset.demo;
    const show=(sel)=>{const el=card.querySelector(sel); if(el) el.style.display=el.style.display==="flex"?"none":"flex"};
    if(t==="toast"){const el=card.querySelector(".demo-toast"); el.style.display="block"; setTimeout(()=>el.style.display="none",2000);}
    if(t==="modal") show(".demo-modal"); if(t==="drawer") show(".demo-drawer"); if(t==="tip"){const el=card.querySelector(".demo-tip"); el.style.display="block"; setTimeout(()=>el.style.display="none",2000);}
    if(t==="acc"){const p=card.querySelector(".demo-acc p"); p.style.display=p.style.display==="block"?"none":"block";}
    if(t==="toggle"){const s=btn.nextElementSibling; const on=s.textContent.includes("OFF"); s.textContent=on?"● ON":"● OFF";}
  });
  document.querySelectorAll("[data-tab]").forEach(btn=>btn.onclick=()=>{btn.closest(".demo-tabs").querySelector(".tabbody").textContent=btn.dataset.tab+" 내용";});
  document.querySelectorAll("[data-count]").forEach(el=>{let n=0; const target=+el.dataset.count; clearInterval(el._t); el._t=setInterval(()=>{n+=2; if(n>=target){n=target; clearInterval(el._t);} el.textContent=n;},30);});
}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.getElementById("q").oninput=render;
const fs=document.getElementById("fs");fs.oninput=()=>{document.documentElement.style.setProperty("--fs",fs.value+"px");document.getElementById("fsval").textContent=fs.value+"px"};
render();
</script>
</body>
</html>
